name: Build Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'clw_app.py'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CLW_Production_Manager clw_app.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLW_Production_Manager_Windows
          path: dist/CLW_Production_Manager.exe
          if-no-files-found: error
          retention-days: 30
